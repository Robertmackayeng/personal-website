title: Robert MacKay, P.Eng.
author: Robert MacKay
email: robert.james.mackay@outlook.com
description: Professional Engineer specializing in instrumentation, control systems, and automation engineering. Project portfolio, technical articles, and insights on nuclear energy, oil & gas, and industrial automation.

# GitHub Pages settings
remote_theme: pages-themes/slate@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM

# URL settings
baseurl: ""
url: "https://robertmackayeng.github.io/personal-website"

# Pagination
paginate: 5
paginate_path: "/blog/page:num/"

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Build settings
exclude: [README.md, Gemfile, Gemfile.lock, vendor]
keep_files: [assets, images]
