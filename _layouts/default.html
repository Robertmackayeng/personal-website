---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ site.github.url }}/assets/css/style.css?v={{ site.github.build_revision }}">
    <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
    <div id="main_content">
        <header>
            <div class="inner">
                <h1>{{ site.title }}</h1>
                <p>{{ site.description }}</p>
                <nav>
                    <a href="{{ '/' | relative_url }}">Home</a>
                    <a href="{{ '/projects/' | relative_url }}">Projects</a>
                    <a href="{{ '/blog/' | relative_url }}">Blog</a>
                    <a href="{{ '/about/' | relative_url }}">About</a>
                    <a href="https://github.com/robertmackayeng" target="_blank">GitHub</a>
                    <a href="https://linkedin.com/in/robertjamesmackay" target="_blank">LinkedIn</a>
                </nav>
            </div>
        </header>

        <div class="inner">
            {{ content }}
        </div>

        <footer>
            <p>&copy; 2026 Robert MacKay, P.Eng. | <a href="https://github.com/robertmackayeng">GitHub</a> | <a href="https://linkedin.com/in/robertjamesmackay">LinkedIn</a></p>
        </footer>
    </div>
</body>
</html>
